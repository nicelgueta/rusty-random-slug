<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rusty Random Slug</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes pop-in {
        from { opacity: 0; transform: translateY(6px) scale(0.97); }
        to { opacity: 1; transform: none; }
      }
      .pop-in { animation: pop-in 0.25s ease-out both; }
    </style>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-900 to-orange-950 text-slate-100 antialiased">
    <main class="mx-auto max-w-2xl px-4 py-12">
      <header class="mb-8 text-center">
        <h1 class="text-4xl font-bold tracking-tight">
          Rusty <span class="text-orange-400">Random</span> Slug
        </h1>
        <p class="mt-2 text-slate-400">Random, unique slugs, generated in your browser via WebAssembly.</p>
        <nav class="mt-4 flex flex-wrap justify-center gap-2 text-sm">
          <a href="https://docs.rs/rustyrs" target="_blank" rel="noopener"
             class="rounded-full border border-slate-700 px-3 py-1 text-slate-300 transition hover:border-orange-400 hover:text-orange-300">
            Rust docs
          </a>
          <a href="https://pypi.org/project/rustyrs/" target="_blank" rel="noopener"
             class="rounded-full border border-slate-700 px-3 py-1 text-slate-300 transition hover:border-orange-400 hover:text-orange-300">
            Python package
          </a>
          <a href="https://github.com/nicelgueta/rusty-random-slug" target="_blank" rel="noopener"
             class="rounded-full border border-slate-700 px-3 py-1 text-slate-300 transition hover:border-orange-400 hover:text-orange-300">
            GitHub
          </a>
        </nav>
      </header>

      <section class="rounded-2xl border border-slate-700/60 bg-slate-800/50 p-6 shadow-xl backdrop-blur">
        <div class="grid gap-4 sm:grid-cols-2">
          <label class="block">
            <span class="text-sm font-medium text-slate-300">Words per slug <span class="text-slate-500">(1–5)</span></span>
            <input id="word_len_inp" type="number" min="1" max="5" value="2"
              class="mt-1 w-full rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 outline-none transition focus:border-orange-400 focus:ring-2 focus:ring-orange-400/30" />
          </label>
          <label class="block">
            <span class="text-sm font-medium text-slate-300">Number of slugs <span class="text-slate-500">(1–10000)</span></span>
            <input id="n_outputs" type="number" min="1" max="10000" value="10"
              class="mt-1 w-full rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 outline-none transition focus:border-orange-400 focus:ring-2 focus:ring-orange-400/30" />
          </label>
        </div>

        <p id="combos" class="mt-3 text-xs text-slate-500"></p>

        <div class="mt-5 flex flex-wrap gap-3">
          <button id="test"
            class="rounded-lg bg-orange-500 px-5 py-2 font-semibold text-slate-950 shadow transition hover:bg-orange-400 active:scale-95">
            Generate batch
          </button>
          <button id="gen"
            class="rounded-lg border border-slate-600 px-5 py-2 font-semibold transition hover:border-orange-400 hover:text-orange-300 active:scale-95">
            Next unique slug
          </button>
          <button id="reset"
            class="ml-auto rounded-lg px-4 py-2 text-slate-400 transition hover:text-slate-100">
            Clear
          </button>
        </div>

        <p id="error" class="mt-4 hidden rounded-lg border border-red-500/40 bg-red-500/10 px-3 py-2 text-sm text-red-300"></p>
      </section>

      <section class="mt-6">
        <div class="mb-2 flex items-center justify-between text-sm text-slate-400">
          <span id="count">No slugs yet</span>
          <button id="copy" class="hidden transition hover:text-orange-300">Copy all</button>
        </div>
        <ul id="slugs" class="flex flex-wrap gap-2"></ul>
      </section>

      <footer class="mt-12 text-center text-xs text-slate-500">
        "Next unique slug" never repeats until the word combinations are exhausted.
      </footer>
    </main>

    <script type="module">
      import init, { random_slugs, combinations, SlugGenerator } from "./pkg/rustyrs.js";
      await init();

      const $ = (id) => document.getElementById(id);
      const lenInput = $("word_len_inp");
      const nInput = $("n_outputs");
      const list = $("slugs");
      const errorEl = $("error");

      let slugGen = null;
      let genLen = null;

      const wordLen = () => parseInt(lenInput.value, 10);

      const showError = (msg) => {
        errorEl.textContent = msg;
        errorEl.classList.toggle("hidden", !msg);
      };

      const updateCount = () => {
        const n = list.children.length;
        $("count").textContent = n ? `${n} slug${n === 1 ? "" : "s"}` : "No slugs yet";
        $("copy").classList.toggle("hidden", !n);
      };

      const updateCombos = () => {
        const wl = wordLen();
        let total;
        try { total = combinations(wl); } catch { total = undefined; }
        $("combos").textContent = total
          ? `Possible combinations with ${wl} word${wl === 1 ? "" : "s"}: ${total.toLocaleString()}`
          : "";
      };

      const addSlug = (slug, i = 0) => {
        const li = document.createElement("li");
        li.textContent = slug;
        li.className = "pop-in cursor-pointer rounded-full border border-slate-700 bg-slate-800 px-3 py-1 font-mono text-sm transition hover:border-orange-400 hover:text-orange-300";
        li.style.animationDelay = `${Math.min(i, 30) * 15}ms`;
        li.title = "Click to copy";
        li.addEventListener("click", () => navigator.clipboard?.writeText(slug));
        list.appendChild(li);
      };

      const generateBatch = () => {
        showError("");
        const wl = wordLen();
        const n = parseInt(nInput.value, 10);
        if (!(wl >= 1 && wl <= 5)) return showError("Word length must be between 1 and 5.");
        if (!(n >= 1 && n <= 10000)) return showError("Number of slugs must be between 1 and 10000.");
        let slugs;
        try { slugs = random_slugs(wl, n); } catch { slugs = undefined; }
        if (!slugs) {
          return showError(`Likely requested more slugs than unique combinations. Max for ${wl} word(s) is ${combinations(wl)}.`);
        }
        list.innerHTML = "";
        slugs.forEach((s, i) => addSlug(s, i));
        updateCount();
      };

      const generateNext = () => {
        showError("");
        const wl = wordLen();
        if (!(wl >= 1 && wl <= 5)) return showError("Word length must be between 1 and 5.");
        if (!slugGen || genLen !== wl) {
          slugGen = new SlugGenerator(wl);
          genLen = wl;
        }
        const slug = slugGen.next();
        if (slug == null) return showError("All unique combinations have been used.");
        addSlug(slug);
        updateCount();
      };

      $("test").addEventListener("click", generateBatch);
      $("gen").addEventListener("click", generateNext);
      $("reset").addEventListener("click", () => {
        list.innerHTML = "";
        slugGen = null;
        showError("");
        updateCount();
      });
      $("copy").addEventListener("click", () => {
        const text = [...list.children].map((li) => li.textContent).join("\n");
        navigator.clipboard?.writeText(text);
        $("copy").textContent = "Copied!";
        setTimeout(() => ($("copy").textContent = "Copy all"), 1200);
      });
      lenInput.addEventListener("input", updateCombos);
      updateCombos();
    </script>
  </body>
</html>
